name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Permissions needed to publish packages to GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

# =============================================================================
# Global Environment Variables (Available to ALL jobs and ALL steps automatically)
# =============================================================================
env:
  POSTGRES_USER: ${{ vars.POSTGRES_USER || 'task_user' }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'task_password' }}
  POSTGRES_DB: ${{ vars.POSTGRES_DB || 'task_db' }}
  PORT: 4000
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_TTL: 60
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://127.0.0.1:4000' }}
  ENV_FILE: ${{ secrets.ENV_FILE }}

jobs:
  # =========================================================================
  # 1. Backend CI: Dependencies, Prisma Generation, & NestJS Compilation
  # =========================================================================
  backend-ci:
    name: Backend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package*.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build NestJS application
        run: npm run build

  # =========================================================================
  # 2. Frontend CI: Dependencies & Next.js Production Compilation
  # =========================================================================
  frontend-ci:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package*.json

      - name: Install dependencies
        run: npm install

      - name: Build Next.js application
        run: npm run build

  # =========================================================================
  # 3. Integration & Docker Test: Verify Full Stack in Docker Compose
  # =========================================================================
  docker-integration-test:
    name: Docker Compose Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [ backend-ci, frontend-ci ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate .env file
        run: |
          if [ -n "$ENV_FILE" ]; then
            echo "==> Creating .env from secrets.ENV_FILE..."
            echo "$ENV_FILE" > .env
          else
            echo "==> Creating .env from GitHub variables and secrets..."
            cat << EOF > .env
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          PORT=$PORT
          DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
          REDIS_HOST=$REDIS_HOST
          REDIS_PORT=$REDIS_PORT
          REDIS_TTL=$REDIS_TTL
          NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
          EOF
          fi

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build and Start Containers
        run: docker compose up --build -d

      - name: Smoke Test Backend API (GET /tasks with retry)
        run: |
          echo "Waiting for backend API to respond with HTTP 200..."
          for i in {1..30}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4000/tasks || true)
            if [ "$status" = "200" ]; then
              echo "Backend is ready and returned HTTP 200 OK!"
              exit 0
            fi
            echo "Waiting for backend... (attempt $i/30, got HTTP $status)"
            sleep 2
          done
          echo "Backend failed to become ready in time"
          docker compose logs backend
          exit 1

      - name: Smoke Test Frontend (GET / with retry)
        run: |
          echo "Waiting for frontend web page to respond with HTTP 200..."
          for i in {1..30}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000 || true)
            if [ "$status" = "200" ]; then
              echo "Frontend is ready and returned HTTP 200 OK!"
              exit 0
            fi
            echo "Waiting for frontend... (attempt $i/30, got HTTP $status)"
            sleep 2
          done
          echo "Frontend failed to become ready in time"
          docker compose logs frontend
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown containers
        run: docker compose down -v

  # =========================================================================
  # 4. CD Step: Build and Push Production Docker Images to GHCR
  #    Only triggers on direct push to main/master after all tests pass
  # =========================================================================
  cd-publish-images:
    name: CD - Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: [ docker-integration-test ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Name
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_REPO }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_REPO }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://127.0.0.1:4000' }}
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 5. CD Step: Deploy to AWS EC2 Instance via SSH
  #    Automatically triggers on push to main/master after all tests pass
  # =========================================================================
  deploy-to-ec2:
    name: CD - Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [ cd-publish-images ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          timeout: 120s
          command_timeout: 30m
          envs: ENV_FILE,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,PORT,REDIS_HOST,REDIS_PORT,REDIS_TTL,NEXT_PUBLIC_API_URL
          script: |
            set -e
            echo "=============================================="
            echo "==> Starting EC2 Automated Deployment"
            echo "=============================================="

            # Target directory on EC2 (defaults to ~/task-manager)
            APP_DIR="${{ secrets.EC2_TARGET_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/task-manager"
            fi

            # Automatically clone repository if not already cloned
            if [ ! -d "$APP_DIR" ]; then
              echo "==> Directory $APP_DIR does not exist. Cloning repository..."
              git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Ensure 1GB swap space exists (optimal balance of memory and disk on 8GB root volume)
            if [ ! -f /swapfile ] && command -v sudo >/dev/null 2>&1; then
              echo "==> Configuring 1GB swap space on EC2..."
              sudo fallocate -l 1G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=1024
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile || true
            fi

            echo "==> Freeing disk space on EC2..."
            docker builder prune -af || true
            docker system prune -f || true
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get clean || true
            fi

            echo "==> Fetching latest changes from git..."
            git fetch origin
            git reset --hard "origin/${{ github.ref_name }}"

            echo "==> Writing .env from GitHub Secrets & Variables..."
            if [ -n "$ENV_FILE" ]; then
              echo "$ENV_FILE" > .env
            else
              cat << EOF > .env
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_DB=$POSTGRES_DB
            PORT=$PORT
            DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
            REDIS_HOST=$REDIS_HOST
            REDIS_PORT=$REDIS_PORT
            REDIS_TTL=$REDIS_TTL
            NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
            EOF
            fi

            echo "==> Rebuilding and restarting Docker Compose services..."
            docker compose up -d --build --remove-orphans

            echo "==> Cleaning up unused dangling Docker images..."
            docker image prune -f

            echo "==> Waiting for backend API to become healthy..."
            for i in {1..30}; do
              status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4000/tasks || true)
              if [ "$status" = "200" ]; then
                echo "==> Backend API is up and healthy (HTTP 200)!"
                break
              fi
              echo "==> Waiting for backend service... (attempt $i/30, got HTTP $status)"
              sleep 2
            done

            echo "=============================================="
            echo "==> EC2 Deployment Completed Successfully!"
            echo "=============================================="


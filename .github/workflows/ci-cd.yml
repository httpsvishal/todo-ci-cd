name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Permissions needed to publish packages to GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # 1. Backend CI: Dependencies, Prisma Generation, & NestJS Compilation
  # =========================================================================
  backend-ci:
    name: Backend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package*.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build NestJS application
        run: npm run build

  # =========================================================================
  # 2. Frontend CI: Dependencies & Next.js Production Compilation
  # =========================================================================
  frontend-ci:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package*.json

      - name: Install dependencies
        run: npm install

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build

  # =========================================================================
  # 3. Integration & Docker Test: Verify Full Stack in Docker Compose
  # =========================================================================
  docker-integration-test:
    name: Docker Compose Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [ backend-ci, frontend-ci ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .env configuration
        run: cp .env.example .env

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build and Start Containers
        run: docker compose up --build -d

      - name: Wait for services to become healthy
        run: |
          echo "Waiting 20 seconds for database migrations and services to initialize..."
          sleep 20
          docker compose ps

      - name: Smoke Test Backend API (GET /tasks)
        run: |
          echo "Testing backend endpoint..."
          response=$(curl --write-out '%{http_code}' --silent --output /dev/null http://localhost:4000/tasks)
          if [ "$response" -ne 200 ]; then
            echo "Backend test failed with status code: $response"
            docker compose logs backend
            exit 1
          fi
          echo "Backend returned HTTP 200 OK"

      - name: Smoke Test Frontend (GET /)
        run: |
          echo "Testing frontend web page..."
          response=$(curl --write-out '%{http_code}' --silent --output /dev/null http://localhost:3000)
          if [ "$response" -ne 200 ]; then
            echo "Frontend test failed with status code: $response"
            docker compose logs frontend
            exit 1
          fi
          echo "Frontend returned HTTP 200 OK"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown containers
        run: docker compose down -v

  # =========================================================================
  # 4. CD Step: Build and Push Production Docker Images to GHCR
  #    Only triggers on direct push to main/master after all tests pass
  # =========================================================================
  cd-publish-images:
    name: CD - Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: [ docker-integration-test ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 5. CD Step: Deploy to AWS EC2 Instance via SSH
  #    Automatically triggers on push to main/master after all tests pass
  # =========================================================================
  deploy-to-ec2:
    name: CD - Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [ cd-publish-images ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            echo "=============================================="
            echo "==> Starting EC2 Automated Deployment"
            echo "=============================================="

            # Navigate to application directory (defaults to ~/task-manager)
            APP_DIR="${{ secrets.EC2_TARGET_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/task-manager"
            fi

            cd "$APP_DIR"

            echo "==> Fetching latest changes from git repository..."
            git pull origin main || git pull origin master

            echo "==> Rebuilding and restarting Docker Compose services..."
            docker compose up -d --build --remove-orphans

            echo "==> Cleaning up unused dangling Docker images..."
            docker image prune -f

            echo "==> Waiting for services to initialize..."
            sleep 15
            docker compose ps

            echo "==> Performing health check on backend API..."
            curl -f http://127.0.0.1:4000/tasks

            echo "=============================================="
            echo "==> EC2 Deployment Completed Successfully!"
            echo "=============================================="


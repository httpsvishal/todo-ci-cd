# ==============================================================
# Nginx Configuration for Task Manager on AWS EC2
# Next.js (Port 3000) & NestJS (Port 4000)
# ==============================================================

# --------------------------------------------------------------
# OPTION 1: Single Domain or EC2 Public IP (Default & Recommended)
# Example: http://<EC2_PUBLIC_IP> or http://example.com
# - Next.js UI is served at /
# - NestJS API is served at /tasks
# --------------------------------------------------------------
server {
    listen 80;
    server_name _; # Replace with your EC2 Public IP or domain name

    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Backend API: Forward /tasks to NestJS on port 4000
    location /tasks {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend: Forward all other requests to Next.js on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (important for Next.js)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

